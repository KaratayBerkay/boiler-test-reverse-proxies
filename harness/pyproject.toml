[project]
name = "pxlab"
version = "0.1.0"
description = "Reverse-proxy lab: capability probes, load tests and chaos (failover / reload) for nginx, HAProxy, Traefik, Caddy, Envoy, Apache httpd, Varnish, OpenResty, Kong, APISIX, ATS, Pingora ... running in Docker Compose against one shared backend"
requires-python = ">=3.12"
dependencies = [
  "httpx[http2]>=0.28",
  "websockets>=13",
  "grpcio>=1.66",
  "grpcio-health-checking>=1.66",
  "h2>=4.1",
  "pyyaml>=6",
  "rich>=13",
  "tabulate>=0.9",
  "typer>=0.12",
]

[project.scripts]
pxlab = "pxlab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pxlab"]
