# Caddy 2 (custom xcaddy build, see Dockerfile). Automatic HTTPS is kept for acme.lab only; every other site has explicit certs.
name: pxlab-caddy
services:
  proxy:
    build: .
    image: pxlab-caddy:latest
    container_name: pxlab-caddy
    cpuset: "0-3"
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    environment:
      OTEL_SERVICE_NAME: caddy
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_SAMPLER: parentbased_traceidratio      # root spans 0.1 %, sampled parents always (the tracing probe sends one)
      OTEL_TRACES_SAMPLER_ARG: "0.001"
    volumes:
      - ./:/etc/caddy:ro
      - ../../shared/certs:/certs:ro
      - ../../shared/static:/static:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "18080:8080"
      - "18443:8443"
      - "18443:8443/udp"
      - "18444:8444"
      - "18445:8445"
      - "18082:8082"
      - "19000:9000"
      - "19001:9001/udp"
      - "19100:9100"
      - "19101:2019"
    ulimits:
      nofile: { soft: 1048576, hard: 1048576 }
    networks:
      pxlab:
        aliases: [proxy, app.lab, a.lab, b.lab, acme.lab, redirect.lab]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9100/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  caddy-data:
  caddy-config:
networks:
  pxlab:
    external: true
    name: pxlab
