# pxlab reference configuration for OpenResty 1.27 (nginx + LuaJIT). Same nginx core as stacks/nginx, but the features
# nginx open source lacks are done in Lua: JWT (lua-resty-jwt), rate/connection limits (lua-resty-limit-traffic),
# forward auth (ngx.location.capture), a real cache purge, fault injection, ACME (lua-resty-acme) and Prometheus
# metrics (nginx-lua-prometheus). Annotated walkthrough: docs/configs/openresty.md.

worker_processes auto;
worker_rlimit_nofile 200000;
env ACME_EAGER;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 32768;
    multi_accept on;
}

stream {
    server { listen 9000; proxy_pass 10.77.0.11:8080; proxy_connect_timeout 3s; }
    server { listen 9001 udp; proxy_pass 10.77.0.11:9002; proxy_responses 1; proxy_timeout 5s; }
    map $ssl_preread_server_name $passthrough_target { default 10.77.0.11:8443; }
    server { listen 8445; ssl_preread on; proxy_pass $passthrough_target; }
}

http {
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    lua_package_path "/etc/openresty/lua/?.lua;;";
    lua_shared_dict limit_req 10m;          # lua-resty-limit-traffic state
    lua_shared_dict limit_conn 10m;
    lua_shared_dict prometheus 16m;         # nginx-lua-prometheus
    lua_shared_dict acme 16m;               # lua-resty-acme (certificates, challenges, account)
    lua_ssl_trusted_certificate /certs/pebble-ca.pem;
    lua_ssl_verify_depth 3;

    log_format json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method","uri":"$request_uri",'
                                '"host":"$host","status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
                                '"upstream":"$upstream_addr","upstream_time":"$upstream_response_time","cache":"$upstream_cache_status",'
                                '"request_id":"$request_id","proto":"$server_protocol","ssl":"$ssl_protocol","ua":"$http_user_agent"}';
    access_log /dev/stdout json buffer=64k flush=1s;

    init_by_lua_block {
        require("resty.acme.autossl").init({
            tos_accepted = true,
            staging = false,
            account_email = "admin@pxlab.test",
            domain_whitelist = { "acme.lab" },
            storage_adapter = "shm",
            storage_config = { shm_name = "acme" },
            challenge_start_delay = 0,
            renew_check_interval = 3600,
            domain_key_types = { "ecc" },
            -- non-blocking: the first handshake for acme.lab gets the fallback cert and starts issuance in a timer.
            -- (blocking = true would issue inside ssl_certificate_by_lua, where cosocket TLS ignores lua_ssl_trusted_certificate)
            blocking = false,
        }, {
            api_uri = "https://pebble:14000/dir",           -- the ACME client config is the SECOND argument
        })
    }
    init_worker_by_lua_block {
        require("resty.acme.autossl").init_worker()
        -- Eager issuance at start-up (worker 0): the first TLS handshake for acme.lab then already has a certificate.
        -- Without it lua-resty-acme issues lazily on the first handshake (fallback cert first, real one seconds later).
        if ngx.worker.id() == 0 and os.getenv("ACME_EAGER") ~= "0" then
            ngx.timer.at(2, function()
                local err = require("resty.acme.autossl").update_cert({ domain = "acme.lab", type = "ecc", tries = 0 })
                ngx.log(ngx.WARN, "acme: eager issuance for acme.lab -> ", err or "ok")
            end)
        end
        -- nginx-lua-prometheus must be initialised per worker (its counters sync into the shared dict)
        prometheus = require("prometheus").init("prometheus")
        metric_requests = prometheus:counter("nginx_http_requests_total", "Number of HTTP requests", {"host", "status"})
        metric_latency = prometheus:histogram("nginx_http_request_duration_seconds", "HTTP request latency", {"host"})
        metric_connections = prometheus:gauge("nginx_http_connections", "Number of HTTP connections", {"state"})
    }
    log_by_lua_block {
        metric_requests:inc(1, { ngx.var.host, ngx.var.status })
        metric_latency:observe(tonumber(ngx.var.request_time), { ngx.var.host })
    }

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_requests 10000;
    keepalive_timeout 75s;
    client_body_buffer_size 128k;
    proxy_buffers 16 16k;
    proxy_buffer_size 16k;
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_http_version 1.1;
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 3;

    gzip on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    proxy_cache_path /var/cache/nginx/lab levels=1:2 keys_zone=lab:16m max_size=512m inactive=10m use_temp_path=off;
    proxy_cache_lock on;

    set_real_ip_from 10.77.0.0/24;
    real_ip_header proxy_protocol;

    map $http_upgrade $connection_upgrade { default upgrade; "" close; }
    map $http_x_request_id $req_id { default $http_x_request_id; "" $request_id; }
    map $http_x_canary $pool_by_header { default pool_app; "1" pool_canary; }
    map $arg_beta $pool_default { default $pool_by_header; "1" pool_canary; }
    map $cookie_lab_sticky $sticky_target { default ""; "~^(?<a>10\.77\.0\.1[1-3]:8080)$" $a; }
    split_clients "${request_id}canary" $pool_canary_split { 10% pool_canary; * pool_app; }

    upstream pool_app       { server app1:8080 max_fails=5 fail_timeout=5s; server app2:8080 max_fails=5 fail_timeout=5s;
                              server app3:8080 max_fails=5 fail_timeout=5s; keepalive 64; }
    upstream pool_b         { server b1:8080; keepalive 16; }
    upstream pool_canary    { server canary:8080; keepalive 16; }
    upstream pool_weighted  { server app1:8080 weight=3; server app2:8080 weight=1; keepalive 32; }
    upstream pool_leastconn { least_conn; server app1:8080; server app2:8080; server slow:8080; keepalive 32; }
    upstream pool_hash      { hash $http_x_user consistent; server app1:8080; server app2:8080; server app3:8080; keepalive 32; }
    upstream pool_retry     { server app1:8080; server app2:8080; server app3:8099; keepalive 32; }
    upstream pool_cb        { server app1:8080 max_fails=3 fail_timeout=10s; server app2:8080 max_fails=3 fail_timeout=10s;
                              server flaky:8080 max_fails=3 fail_timeout=10s; keepalive 32; }
    upstream pool_grpc      { server app1:9090; keepalive 256; }
    upstream pool_tls       { server app1:8443; keepalive 16; }

    # ============================================================================================ default vhost
    server {
        listen 80 default_server;
        listen 8080 default_server;
        listen 8443 ssl default_server;
        listen 8443 quic reuseport;
        http2 on;
        server_name app.lab localhost proxy;
        ssl_certificate /certs/app.lab.fullchain.crt;
        ssl_certificate_key /certs/app.lab.key;
        include /etc/openresty/snippets/tls.conf;
        add_header Alt-Svc 'h3=":8443"; ma=86400';

        location / { include /etc/openresty/snippets/proxy-headers.conf; proxy_pass http://$pool_default; }
        location /api/ {
            if ($request_method = DELETE) { return 405; }
            include /etc/openresty/snippets/proxy-headers.conf;
            proxy_set_header X-Route api;
            proxy_pass http://pool_app/;
        }
        location ~ ^/v[0-9]+/ { include /etc/openresty/snippets/proxy-headers.conf; proxy_set_header X-Route versioned; proxy_pass http://pool_app; }
        location /old/ {
            rewrite ^/old/(.*)$ /new/$1 break;
            include /etc/openresty/snippets/proxy-headers.conf;
            proxy_set_header X-Route rewritten;
            proxy_pass http://pool_app;
        }
        location = /redirect-me { return 301 /landing; }
        location = /ws { include /etc/openresty/snippets/proxy-headers-ws.conf; proxy_read_timeout 300s; proxy_pass http://pool_app; }
        location = /sse { include /etc/openresty/snippets/proxy-headers.conf; proxy_buffering off; proxy_read_timeout 300s; proxy_pass http://pool_app; }
        location /grpc.health.v1.Health/ { grpc_pass grpc://pool_grpc; grpc_set_header X-Lab-Proxy openresty; }

        # --- Lua limiters (lua-resty-limit-traffic): 10 r/s + burst 5 per client, 3 concurrent connections per client
        location = /limited {
            access_by_lua_block {
                local limit_req = require("resty.limit.req")
                local lim, err = limit_req.new("limit_req", 10, 5)
                if not lim then ngx.log(ngx.ERR, "limit_req: ", err) return ngx.exit(500) end
                local delay, err = lim:incoming(ngx.var.binary_remote_addr, true)
                if not delay then
                    if err == "rejected" then return ngx.exit(429) end
                    return ngx.exit(500)
                end
                -- nginx "nodelay" semantics: burst requests are served immediately, anything beyond the burst is rejected
                -- (sleeping `delay` here instead would smooth the burst like limit_req without nodelay)
            }
            include /etc/openresty/snippets/proxy-headers.conf;
            proxy_pass http://pool_app;
        }
        location = /conn-limited {
            access_by_lua_block {
                local limit_conn = require("resty.limit.conn")
                local lim, err = limit_conn.new("limit_conn", 3, 0, 0.5)
                if not lim then return ngx.exit(500) end
                local delay, err = lim:incoming(ngx.var.binary_remote_addr, true)
                if not delay then
                    if err == "rejected" then return ngx.exit(429) end
                    return ngx.exit(500)
                end
                ngx.ctx.limit_conn = lim
            }
            log_by_lua_block {
                local lim = ngx.ctx.limit_conn
                if lim then lim:leaving(ngx.var.binary_remote_addr, tonumber(ngx.var.request_time)) end
            }
            include /etc/openresty/snippets/proxy-headers.conf;
            proxy_pass http://pool_app/delay/1000;
        }
        location = /allowed { allow 10.77.0.1; deny all; include /etc/openresty/snippets/proxy-headers.conf; proxy_pass http://pool_app; }
        location = /denied  { deny 10.77.0.0/24; allow all; include /etc/openresty/snippets/proxy-headers.conf; proxy_pass http://pool_app; }
        location = /basic { auth_basic "pxlab"; auth_basic_user_file /auth/htpasswd; include /etc/openresty/snippets/proxy-headers.conf; proxy_pass http://pool_app; }
        location = /upload { client_max_body_size 1m; include /etc/openresty/snippets/proxy-headers.conf; proxy_pass http://pool_app; }
        location = /timeout { proxy_read_timeout 2s; proxy_next_upstream off; include /etc/openresty/snippets/proxy-headers.conf; proxy_pass http://pool_app/delay/5000; }
        location = /fault {                     # fault injection in Lua
            access_by_lua_block { if math.random() < 0.2 then return ngx.exit(503) end }
            include /etc/openresty/snippets/proxy-headers.conf;
            proxy_pass http://pool_app;
        }
        location = /bw { limit_rate 500k; include /etc/openresty/snippets/proxy-headers.conf; proxy_pass http://pool_app/bin/1048576; }
        location /static/ { alias /static/; }
        location = /error-page {
            proxy_intercept_errors on;
            error_page 500 502 503 504 /_error.html;
            include /etc/openresty/snippets/proxy-headers.conf;
            proxy_pass http://pool_app/status/503;
        }
        location = /_error.html { internal; root /static; try_files /error.html =503; add_header X-Error-Page custom always; }
        location = /cors {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "$http_origin" always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
                add_header Access-Control-Max-Age 600 always;
                return 204;
            }
            add_header Access-Control-Allow-Origin "$http_origin" always;
            include /etc/openresty/snippets/proxy-headers.conf;
            proxy_pass http://pool_app;
        }
        location = /secure {
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            include /etc/openresty/snippets/proxy-headers.conf;
            proxy_pass http://pool_app;
        }
        # --- cache with a REAL purge: PURGE deletes the cache file (key -> md5 -> levels 1:2 path) from Lua
        location /cacheable/ {
            proxy_cache lab;
            proxy_cache_key $scheme$host$uri;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            if ($request_method = PURGE) { return 418; }
            error_page 418 = @purge;
            add_header X-Cache $upstream_cache_status always;
            include /etc/openresty/snippets/proxy-headers.conf;
            proxy_pass http://pool_app;
        }
        location @purge {
            content_by_lua_block {
                local key = ngx.var.scheme .. ngx.var.host .. ngx.var.uri
                local md5 = ngx.md5(key)
                local path = "/var/cache/nginx/lab/" .. md5:sub(-1) .. "/" .. md5:sub(-3, -2) .. "/" .. md5
                local ok, err = os.remove(path)
                ngx.header["X-Cache"] = ok and "PURGED" or "NOT-FOUND"
                ngx.say(ok and ("purged " .. key) or ("nothing cached for " .. key .. " (" .. tostring(err) .. ")"))
            }
        }
        location /cacheable-short/ {
            proxy_cache lab;
            proxy_cache_key $scheme$host$uri;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header X-Cache $upstream_cache_status always;
            include /etc/openresty/snippets/proxy-headers.conf;
            proxy_pass http://pool_app;
        }
        location = /compressible { include /etc/openresty/snippets/proxy-headers.conf; proxy_pass http://pool_app/size/65536; }
        location /.well-known/acme-challenge { content_by_lua_block { require("resty.acme.autossl").serve_http_challenge() } }
    }

    # ============================================================================================ host routing
    server {
        listen 80; listen 8080; listen 8443 ssl; http2 on;
        server_name a.lab;
        ssl_certificate /certs/app.lab.fullchain.crt; ssl_certificate_key /certs/app.lab.key;
        location / { include /etc/openresty/snippets/proxy-headers.conf; proxy_set_header X-Route a; proxy_pass http://pool_app; }
    }
    server {
        listen 80; listen 8080; listen 8443 ssl; http2 on;
        server_name b.lab;
        ssl_certificate /certs/b.lab.fullchain.crt; ssl_certificate_key /certs/b.lab.key;
        location / { include /etc/openresty/snippets/proxy-headers.conf; proxy_set_header X-Route b; proxy_pass http://pool_b; }
    }
    server { listen 80; listen 8080; server_name redirect.lab; return 301 https://$host$request_uri; }

    # ============================================================================================ load balancing
    server { listen 80; listen 8080; server_name weighted.lab;  location / { include /etc/openresty/snippets/proxy-headers.conf; proxy_pass http://pool_weighted; } }
    server { listen 80; listen 8080; server_name leastconn.lab; location / { include /etc/openresty/snippets/proxy-headers.conf; proxy_pass http://pool_leastconn; } }
    server { listen 80; listen 8080; server_name hash.lab;      location / { include /etc/openresty/snippets/proxy-headers.conf; proxy_pass http://pool_hash; } }
    server { listen 80; listen 8080; server_name retry.lab;     location / { include /etc/openresty/snippets/proxy-headers.conf; proxy_pass http://pool_retry; } }
    server {
        listen 80; listen 8080; server_name cb.lab;
        location / { include /etc/openresty/snippets/proxy-headers.conf; proxy_next_upstream error timeout http_500 http_502 http_503; proxy_pass http://pool_cb; }
    }
    server { listen 80; listen 8080; server_name health.lab;    location / { include /etc/openresty/snippets/proxy-headers.conf; proxy_pass http://pool_app; } }
    server {
        listen 80; listen 8080; server_name sticky.lab;
        location / {
            include /etc/openresty/snippets/proxy-headers.conf;
            set $target http://pool_app;
            if ($sticky_target != "") { set $target http://$sticky_target; }
            add_header Set-Cookie "lab_sticky=$upstream_addr; Path=/; HttpOnly";
            proxy_pass $target;
        }
    }
    server { listen 80; listen 8080; server_name canary.lab;   location / { include /etc/openresty/snippets/proxy-headers.conf; proxy_pass http://$pool_canary_split; } }
    server {
        listen 80; listen 8080; server_name mirror.lab;
        location / { mirror /_mirror; mirror_request_body on; include /etc/openresty/snippets/proxy-headers.conf; proxy_pass http://pool_app; }
        location = /_mirror { internal; proxy_pass http://shadow:8080$request_uri; }
    }

    # ============================================================================================ upstream protocols
    server {
        listen 80; listen 8080; server_name tls.lab;
        location / {
            include /etc/openresty/snippets/proxy-headers.conf;
            proxy_ssl_verify on; proxy_ssl_trusted_certificate /certs/ca.crt; proxy_ssl_server_name on; proxy_ssl_name backend.lab;
            proxy_ssl_protocols TLSv1.2 TLSv1.3; proxy_ssl_session_reuse on;
            proxy_pass https://pool_tls;
        }
    }
    server { listen 80; listen 8080; server_name h2.lab pp.lab; location / { include /etc/openresty/snippets/proxy-headers.conf; proxy_pass http://pool_app; } }

    # ============================================================================================ auth (Lua)
    server {                                    # forward auth: subrequest to the auth service from access_by_lua
        listen 80; listen 8080; server_name auth.lab;
        location / {
            access_by_lua_block {
                local res = ngx.location.capture("/_auth", { method = ngx.HTTP_GET })
                if res.status ~= 200 then
                    ngx.header["WWW-Authenticate"] = 'Bearer realm="pxlab"'
                    return ngx.exit(res.status == 401 and 401 or 403)
                end
                ngx.req.set_header("X-Auth-User", res.header["X-Auth-User"] or "")
                ngx.req.set_header("X-Auth-Groups", res.header["X-Auth-Groups"] or "")
            }
            include /etc/openresty/snippets/proxy-headers.conf;
            proxy_pass http://pool_app;
        }
        location = /_auth { internal; proxy_pass http://app1:8080/auth; proxy_pass_request_body off; proxy_set_header Content-Length ""; proxy_set_header X-Original-URI $request_uri; }
    }
    server {                                    # JWT HS256 with lua-resty-jwt
        listen 80; listen 8080; server_name jwt.lab;
        location / {
            access_by_lua_block {
                local jwt = require("resty.jwt")
                local validators = require("resty.jwt-validators")
                local auth = ngx.var.http_authorization or ""
                local token = auth:match("^Bearer%s+(.+)$")
                if not token then ngx.header["WWW-Authenticate"] = 'Bearer realm="pxlab"' return ngx.exit(401) end
                local obj = jwt:verify("pxlab-jwt-secret-please-change-0123456789", token, { exp = validators.is_not_expired() })
                if not obj.verified then ngx.log(ngx.WARN, "jwt: ", obj.reason) return ngx.exit(401) end
                ngx.req.set_header("X-JWT-Sub", obj.payload.sub or "")
            }
            include /etc/openresty/snippets/proxy-headers.conf;
            proxy_pass http://pool_app;
        }
    }

    # ============================================================================================ TLS variants
    server {
        listen 8444 ssl; http2 on;
        server_name mtls.lab;
        ssl_certificate /certs/app.lab.fullchain.crt; ssl_certificate_key /certs/app.lab.key;
        ssl_client_certificate /certs/ca.crt; ssl_verify_client on;
        include /etc/openresty/snippets/tls.conf;
        location / {
            include /etc/openresty/snippets/proxy-headers.conf;
            proxy_set_header X-Client-Cert-CN $ssl_client_s_dn;
            proxy_pass http://pool_app;
        }
    }
    server {                                    # ACME: certificate fetched from Pebble by lua-resty-acme on the first TLS handshake
        listen 8443 ssl; http2 on;
        server_name acme.lab;
        ssl_certificate /certs/app.lab.fullchain.crt;         # placeholder; replaced per-handshake by ssl_certificate_by_lua
        ssl_certificate_key /certs/app.lab.key;
        ssl_certificate_by_lua_block { require("resty.acme.autossl").ssl_certificate() }
        location / { include /etc/openresty/snippets/proxy-headers.conf; proxy_pass http://pool_app; }
    }
    server { listen 8082 proxy_protocol; server_name app.lab; location / { include /etc/openresty/snippets/proxy-headers.conf; proxy_pass http://pool_app; } }

    # ============================================================================================ operations
    server {
        listen 9100;
        location = /metrics { content_by_lua_block { metric_connections:set(ngx.var.connections_active, {"active"}) prometheus:collect() } }
        location = /healthz { return 200 "ok\n"; }
    }
    server {
        listen 9101;
        location = /nginx_status { stub_status; }
        location = /healthz { return 200 "ok\n"; }
        location = /_pebble-check {         # verifies that cosocket TLS trusts Pebble (debug aid for the ACME setup)
            content_by_lua_block {
                local httpc = require("resty.http").new()
                local res, err = httpc:request_uri("https://pebble:14000/dir", { ssl_verify = true })
                ngx.say(res and res.status or ("error: " .. tostring(err)))
            }
        }
    }
}
