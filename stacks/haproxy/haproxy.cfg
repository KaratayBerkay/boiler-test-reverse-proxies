# pxlab reference configuration for HAProxy 3.4 LTS (official `haproxy:lts` image, master-worker mode).
# Implements the lab contract (docs/contract.md); annotated walkthrough: docs/configs/haproxy.md.

global
    log stdout format raw local0 info
    expose-experimental-directives              # required by the ACME section (3.2+)
    stats socket ipv4@0.0.0.0:9999 level admin expose-fd listeners   # runtime API (show info / set server ... / acme renew)
    stats socket /tmp/haproxy.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    maxconn 60000
    # threads follow the CPUs allowed by the cpuset (4); `nbthread` can pin it explicitly
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-bind-ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256
    ssl-default-server-options ssl-min-ver TLSv1.2
    tune.ssl.default-dh-param 2048
    tune.bufsize 16384
    tune.lua.bool-sample-conversion normal
    # the internal HTTP client (ACME, Lua httpclient) resolves names through Docker's DNS and trusts Pebble's CA
    httpclient.resolvers.id docker
    httpclient.resolvers.prefer ipv4
    httpclient.ssl.ca-file /certs/pebble-ca.pem
    httpclient.ssl.verify required
    lua-load /usr/local/etc/haproxy/lab.lua       # forward-auth action (there is no built-in external-auth in HAProxy)

resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

defaults
    mode http
    log global
    # structured JSON access log (3.0+ "+json" encoder with named fields)
    log-format '%{+json}o %(time)t %(client_ip)ci %(frontend)f %(backend)b %(server)s %(status)ST %(bytes)B %(time_ms)Ta %(method)HM %(uri)HU %(proto)HV %(request_id)ID %(ssl)sslv'
    option httpchk GET /healthz
    http-check expect status 200
    option forwardfor                            # X-Forwarded-For
    option forwarded proto host for              # RFC 7239 Forwarded (2.8+)
    option http-keep-alive
    http-reuse always                            # upstream connection pool shared by all clients
    timeout connect 3s
    timeout client 60s
    timeout server 30s
    timeout http-request 10s
    timeout http-keep-alive 75s
    timeout queue 10s
    timeout tunnel 1h                            # WebSocket
    retries 3
    option redispatch                            # retry on another server after a connection failure
    retry-on conn-failure empty-response
    default-server inter 2s fall 2 rise 2 resolvers docker resolve-prefer ipv4 init-addr last,libc,none
    unique-id-format %{+X}o\ %ci:%cp_%fi:%fp_%Ts_%rt:%pid
    compression algo-res gzip                    # slz gzip (brotli/zstd are not available)
    compression type text/plain application/json text/html text/css application/javascript
    errorfiles lab

http-errors lab
    errorfile 503 /usr/local/etc/haproxy/errors/503.http

userlist lab
    user lab insecure-password lab-pass

cache lab
    total-max-size 256                           # MB
    max-object-size 262144
    max-age 60
    process-vary on

# ---------------------------------------------------------------------------------------------- stick tables (limits)
backend st_req_rate
    stick-table type ip size 100k expire 30s store http_req_rate(1s)
backend st_conn
    stick-table type ip size 100k expire 30s store conn_cur

# ---------------------------------------------------------------------------------------------- ACME (Pebble)
acme pebble
    directory https://pebble:14000/dir
    contact admin@pxlab.test
    challenge http-01
    keytype ECDSA
    curves P-256
    map virt@acme

crt-store
    load crt "/tmp/acme.lab.pem" alias "acme" acme pebble domains "acme.lab"    # starts with a temporary key pair, replaced once issued

# ---------------------------------------------------------------------------------------------- L7 frontend
frontend fe_http
    bind :80
    bind :8080                                   # HTTP/1.1; HTTP/2 prior knowledge is detected implicitly (h2c)
    bind :8443 ssl crt /certs/app.lab.pem crt /certs/b.lab.pem crt "@/acme" alpn h2,http/1.1     # SNI picks the certificate
    bind quic4@:8443 ssl crt /certs/app.lab.pem crt /certs/b.lab.pem crt "@/acme" alpn h3           # HTTP/3
    bind :8444 ssl crt /certs/app.lab.pem ca-file /certs/ca.crt verify required alpn h2,http/1.1     # mTLS
    bind :8082 accept-proxy                      # PROXY protocol from the client side
    maxconn 50000
    # with more than one filter, each one must be declared explicitly (order = processing order)
    filter cache lab
    filter compression
    filter bwlim-out lab_bw default-limit 500000 default-period 1s

    # ACME HTTP-01 challenge (the acme task fills the virt@acme map)
    http-request return status 200 content-type text/plain lf-string "%[path,field(-1,/)].%[path,field(-1,/),map(virt@acme)]\n" if { path_beg /.well-known/acme-challenge/ }

    http-response set-header alt-svc 'h3=":8443"; ma=86400'
    http-request set-var(txn.h) req.hdr(host),field(1,:),lower
    http-request set-var(txn.path) path
    http-request set-header X-Forwarded-Proto %[ssl_fc,iif(https,http)]
    http-request set-header X-Forwarded-Host %[req.hdr(host)]
    http-request set-header X-Real-IP %[src]
    http-request set-header X-Lab-Proxy haproxy
    http-request set-header X-Request-ID %[unique-id] unless { req.hdr(X-Request-ID) -m found }
    http-request set-header X-Client-Cert-CN %[ssl_c_s_dn(CN)] if { ssl_c_used }
    http-request set-header X-Client-Cert-Verify %[ssl_c_verify] if { ssl_c_used }
    http-response del-header X-Powered-By
    http-response set-header Server haproxy

    # --- host-based rules
    http-request redirect scheme https code 301 if { var(txn.h) -m str redirect.lab } !{ ssl_fc }
    http-request set-header X-Route a if { var(txn.h) -m str a.lab }
    http-request set-header X-Route b if { var(txn.h) -m str b.lab }
    # forward auth (Lua httpclient -> app1:8080/auth)
    http-request lua.forward_auth if { var(txn.h) -m str auth.lab }
    http-request deny deny_status 401 hdr WWW-Authenticate 'Bearer realm="pxlab"' if { var(txn.h) -m str auth.lab } !{ var(txn.auth_ok) -m int 1 }
    http-request set-header X-Auth-User %[var(txn.auth_user)] if { var(txn.h) -m str auth.lab }
    # JWT HS256 (jwt_verify + exp claim)
    http-request set-var(txn.jwt) req.hdr(authorization),word(2," ") if { var(txn.h) -m str jwt.lab }
    http-request set-var(txn.now) date if { var(txn.h) -m str jwt.lab }
    http-request deny deny_status 401 if { var(txn.h) -m str jwt.lab } !{ var(txn.jwt),jwt_verify("HS256","pxlab-jwt-secret-please-change-0123456789") -m int 1 }
    http-request deny deny_status 401 if { var(txn.h) -m str jwt.lab } { var(txn.jwt),jwt_payload_query('$.exp','int'),sub(txn.now) -m int lt 1 }
    http-request set-header X-JWT-Sub %[var(txn.jwt),jwt_payload_query('$.sub')] if { var(txn.h) -m str jwt.lab }

    # --- path-based rules (app.lab)
    http-request deny deny_status 405 if { path_beg /api/ } METH_DELETE
    http-request set-header X-Route api if { path_beg /api/ }
    http-request set-path %[path,regsub(^/api/,/)] if { path_beg /api/ }
    http-request set-header X-Route versioned if { path_reg ^/v[0-9]+/ }
    http-request set-header X-Route rewritten if { path_beg /old/ }
    http-request set-path %[path,regsub(^/old/,/new/)] if { path_beg /old/ }
    http-request redirect location /landing code 301 if { path /redirect-me }
    # limits
    http-request track-sc0 src table st_req_rate if { path /limited }
    http-request deny deny_status 429 if { path /limited } { sc_http_req_rate(0) gt 10 }
    http-request track-sc1 src table st_conn if { path /conn-limited }
    http-request deny deny_status 429 if { path /conn-limited } { sc_conn_cur(1) gt 3 }
    http-request set-path /delay/1000 if { path /conn-limited }
    http-request deny if { path /denied } { src 10.77.0.0/24 }
    http-request deny if { path /allowed } !{ src 10.77.0.1 }
    http-request auth realm pxlab if { path /basic } !{ http_auth(lab) }
    http-request deny deny_status 413 if { path /upload } { req.hdr_val(content-length) gt 1048576 }
    http-request set-path /delay/5000 if { path /timeout }      # (the 2 s server timeout is set in be_app: set-timeout needs a backend)
    http-request deny deny_status 503 if { path /fault } { rand(100) lt 20 }
    http-request set-path /bin/1048576 if { path /bw }
    http-response set-bandwidth-limit lab_bw if { var(txn.path) -m str /bw }
    http-request return status 200 content-type text/html file /static/index.html if { path /static/index.html }
    http-request set-path /status/503 if { path /error-page }
    http-response return status 503 content-type text/html file /static/error.html hdr X-Error-Page custom if { var(txn.path) -m str /error-page } { status 503 }
    http-request return status 204 hdr Access-Control-Allow-Origin %[req.hdr(origin)] hdr Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" hdr Access-Control-Allow-Headers "Authorization, Content-Type" hdr Access-Control-Max-Age 600 if { path /cors } METH_OPTIONS
    http-response set-header Access-Control-Allow-Origin "*" if { var(txn.path) -m str /cors }
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains" if { var(txn.path) -m str /secure }
    http-response set-header X-Content-Type-Options nosniff if { var(txn.path) -m str /secure }
    http-response set-header X-Frame-Options DENY if { var(txn.path) -m str /secure }
    http-response set-header Referrer-Policy strict-origin-when-cross-origin if { var(txn.path) -m str /secure }
    http-request set-path /size/65536 if { path /compressible }
    # cache (Cache-Control from the origin decides; no purge API, no stale-on-error)
    http-request cache-use lab if { path_beg /cacheable/ } || { path_beg /cacheable-short/ }
    http-response cache-store lab
    http-response set-header X-Cache HIT if { res.cache_hit }
    http-response set-header X-Cache MISS if !{ res.cache_hit } { var(txn.path) -m beg /cacheable }

    # --- backend selection
    use_backend be_grpc      if { path_beg /grpc.health.v1.Health/ }
    use_backend be_b         if { var(txn.h) -m str b.lab }
    use_backend be_weighted  if { var(txn.h) -m str weighted.lab }
    use_backend be_leastconn if { var(txn.h) -m str leastconn.lab }
    use_backend be_hash      if { var(txn.h) -m str hash.lab }
    use_backend be_sticky    if { var(txn.h) -m str sticky.lab }
    use_backend be_retry     if { var(txn.h) -m str retry.lab }
    use_backend be_cb        if { var(txn.h) -m str cb.lab }
    use_backend be_health    if { var(txn.h) -m str health.lab }
    use_backend be_canary_split if { var(txn.h) -m str canary.lab }
    use_backend be_pp        if { var(txn.h) -m str pp.lab }
    use_backend be_h2        if { var(txn.h) -m str h2.lab }
    use_backend be_tls       if { var(txn.h) -m str tls.lab }
    use_backend be_canary    if { req.hdr(X-Canary) -m str 1 } || { urlp(beta) -m str 1 }
    default_backend be_app

# ---------------------------------------------------------------------------------------------- backends
backend be_app
    balance roundrobin
    http-request set-timeout server 2s if { var(txn.path) -m str /timeout }
    server app1 app1:8080 check maxconn 20000
    server app2 app2:8080 check maxconn 20000
    server app3 app3:8080 check maxconn 20000
backend be_b
    server b1 b1:8080 check
backend be_canary
    server canary canary:8080 check
backend be_weighted
    balance roundrobin
    server app1 app1:8080 weight 3 check
    server app2 app2:8080 weight 1 check
backend be_leastconn
    balance leastconn
    server app1 app1:8080 check
    server app2 app2:8080 check
    server slow slow:8080 check
backend be_hash
    balance hdr(X-User)
    hash-type consistent
    server app1 app1:8080 check
    server app2 app2:8080 check
    server app3 app3:8080 check
backend be_sticky
    balance roundrobin
    cookie lab_sticky insert indirect nocache httponly
    server app1 app1:8080 cookie a1 check
    server app2 app2:8080 cookie a2 check
    server app3 app3:8080 cookie a3 check
backend be_retry                                 # no health checks on purpose: the dead member is only discovered by connect failures
    balance roundrobin
    server app1 app1:8080
    server app2 app2:8080
    server dead app3:8099
backend be_cb                                    # passive: observe L7 responses, 3 errors -> mark down; L7 retries hide the rest
    balance roundrobin
    retry-on all-retryable-errors
    server app1 app1:8080 check observe layer7 error-limit 3 on-error mark-down
    server app2 app2:8080 check observe layer7 error-limit 3 on-error mark-down
    server flaky flaky:8080 check observe layer7 error-limit 3 on-error mark-down
backend be_health                                # active checks: GET /healthz every 1 s
    balance roundrobin
    server app1 app1:8080 check inter 1s fall 2 rise 2
    server app2 app2:8080 check inter 1s fall 2 rise 2
    server app3 app3:8080 check inter 1s fall 2 rise 2
backend be_canary_split                          # 90/10 by weights
    balance roundrobin
    server app1 app1:8080 weight 30 check
    server app2 app2:8080 weight 30 check
    server app3 app3:8080 weight 30 check
    server canary canary:8080 weight 10 check
backend be_pp                                    # PROXY protocol v2 towards the upstream (health checks send it too: check-send-proxy)
    server app1 app1:8081 send-proxy-v2 check check-send-proxy
backend be_h2                                    # HTTP/2 (h2c) towards the upstream
    server app1 app1:8080 proto h2
backend be_tls                                   # TLS re-encryption, verified against the lab CA
    server app1 app1:8443 ssl verify required ca-file /certs/ca.crt sni str(backend.lab) alpn http/1.1 check check-sni backend.lab
backend be_grpc                                  # gRPC: h2c to app1:9090 (TCP check: the gRPC port does not answer GET /healthz)
    option tcp-check
    server app1 app1:9090 proto h2 check

# ---------------------------------------------------------------------------------------------- L4
frontend fe_tcp
    mode tcp
    bind :9000
    default_backend be_tcp
backend be_tcp
    mode tcp
    server app1 app1:8080

frontend fe_passthrough                          # TLS passthrough routed by SNI (no decryption)
    mode tcp
    bind :8445
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }
    use_backend be_passthrough if { req.ssl_sni -i passthrough.lab }
    default_backend be_passthrough
backend be_passthrough
    mode tcp
    server app1 app1:8443

# ---------------------------------------------------------------------------------------------- operations
frontend metrics
    bind :9100
    http-request use-service prometheus-exporter if { path /metrics }
    http-request return status 200 content-type text/plain string "ok\n" if { path /healthz }
frontend stats
    bind :9101
    stats enable
    stats uri /stats
    stats refresh 5s
    stats show-legends
    stats admin if TRUE
