# pxlab reference configuration for Apache httpd 2.4 as a reverse proxy (official `httpd:2.4` image, event MPM).
# Implements the lab contract (docs/contract.md); annotated walkthrough: docs/configs/apache.md.
ServerRoot "/usr/local/apache2"
Listen 80
Listen 8080
Listen 8443
Listen 8444
Listen 8082
Listen 9101

# ---------------------------------------------------------------------------------------------- modules
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authn_file_module modules/mod_authn_file.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule authz_user_module modules/mod_authz_user.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule auth_basic_module modules/mod_auth_basic.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule watchdog_module modules/mod_watchdog.so
LoadModule reqtimeout_module modules/mod_reqtimeout.so
LoadModule filter_module modules/mod_filter.so
LoadModule deflate_module modules/mod_deflate.so
LoadModule brotli_module modules/mod_brotli.so
LoadModule ratelimit_module modules/mod_ratelimit.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule logio_module modules/mod_logio.so
LoadModule env_module modules/mod_env.so
LoadModule headers_module modules/mod_headers.so
LoadModule unique_id_module modules/mod_unique_id.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule remoteip_module modules/mod_remoteip.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule proxy_http2_module modules/mod_proxy_http2.so
LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so
LoadModule proxy_balancer_module modules/mod_proxy_balancer.so
LoadModule proxy_hcheck_module modules/mod_proxy_hcheck.so
LoadModule lbmethod_byrequests_module modules/mod_lbmethod_byrequests.so
LoadModule lbmethod_bybusyness_module modules/mod_lbmethod_bybusyness.so
LoadModule slotmem_shm_module modules/mod_slotmem_shm.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule http2_module modules/mod_http2.so
LoadModule md_module modules/mod_md.so
LoadModule cache_module modules/mod_cache.so
LoadModule cache_disk_module modules/mod_cache_disk.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule status_module modules/mod_status.so
LoadModule dir_module modules/mod_dir.so
LoadModule alias_module modules/mod_alias.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule macro_module modules/mod_macro.so

User daemon
Group daemon
ServerName app.lab
ServerTokens Prod
ServerSignature Off
ErrorLog /proc/self/fd/2
LogLevel warn
# ---------------------------------------------------------------------------------------------- JSON access log
LogFormat "{\"time\":\"%{%Y-%m-%dT%H:%M:%S%z}t\",\"remote_addr\":\"%a\",\"method\":\"%m\",\"uri\":\"%U%q\",\"host\":\"%V\",\"status\":%>s,\"bytes\":%O,\"duration_us\":%D,\"proto\":\"%H\",\"request_id\":\"%{UNIQUE_ID}e\",\"cache\":\"%{cache-status}e\",\"ua\":\"%{User-Agent}i\"}" json
CustomLog /proc/self/fd/1 json

# ---------------------------------------------------------------------------------------------- event MPM sizing (4 cores)
ServerLimit 4
StartServers 4
ThreadsPerChild 256
ThreadLimit 256
MaxRequestWorkers 1024
AsyncRequestWorkerFactor 8
MaxConnectionsPerChild 0
KeepAlive On
KeepAliveTimeout 75
MaxKeepAliveRequests 10000
Timeout 60
RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500
TypesConfig conf/mime.types
Protocols h2 h2c http/1.1
H2MaxSessionStreams 128

<Directory />
    AllowOverride none
    Require all denied
</Directory>
<Directory /static>
    Require all granted
</Directory>

# ---------------------------------------------------------------------------------------------- proxy defaults
ProxyRequests Off
ProxyPreserveHost On
# X-Forwarded-For / -Host / -Server
ProxyAddHeaders On
ProxyTimeout 30
ProxyErrorOverride Off
SSLProxyEngine On
SSLProxyProtocol -all +TLSv1.2 +TLSv1.3
ProxyHCExpr ok {%{REQUEST_STATUS} =~ /^[234]/}

<Proxy "balancer://app">
    BalancerMember "http://app1:8080" hcmethod=GET hcuri=/healthz hcinterval=2 hcfails=2 hcpasses=2 hcexpr=ok retry=5 keepalive=On max=2000
    BalancerMember "http://app2:8080" hcmethod=GET hcuri=/healthz hcinterval=2 hcfails=2 hcpasses=2 hcexpr=ok retry=5 keepalive=On max=2000
    BalancerMember "http://app3:8080" hcmethod=GET hcuri=/healthz hcinterval=2 hcfails=2 hcpasses=2 hcexpr=ok retry=5 keepalive=On max=2000
    ProxySet lbmethod=byrequests
</Proxy>
<Proxy "balancer://weighted">
    BalancerMember "http://app1:8080" loadfactor=3
    BalancerMember "http://app2:8080" loadfactor=1
    ProxySet lbmethod=byrequests
</Proxy>
<Proxy "balancer://leastconn">
    BalancerMember "http://app1:8080"
    BalancerMember "http://app2:8080"
    BalancerMember "http://slow:8080"
    ProxySet lbmethod=bybusyness
</Proxy>
<Proxy "balancer://sticky">
    BalancerMember "http://app1:8080" route=a1
    BalancerMember "http://app2:8080" route=a2
    BalancerMember "http://app3:8080" route=a3
    ProxySet lbmethod=byrequests stickysession=lab_sticky
</Proxy>
# the dead member is skipped after its first connect failure (retry=0 keeps trying it)
<Proxy "balancer://retry">
    BalancerMember "http://app1:8080" retry=30
    BalancerMember "http://app2:8080" retry=30
    BalancerMember "http://app3:8099" retry=30
    ProxySet lbmethod=byrequests
</Proxy>
# failonstatus: a 5xx puts the member in error state for `retry` seconds
<Proxy "balancer://cb">
    BalancerMember "http://app1:8080" retry=10
    BalancerMember "http://app2:8080" retry=10
    BalancerMember "http://flaky:8080" retry=10
    ProxySet lbmethod=byrequests failonstatus=500,502,503
</Proxy>
# active health checks every second (mod_proxy_hcheck + mod_watchdog)
<Proxy "balancer://health">
    BalancerMember "http://app1:8080" hcmethod=GET hcuri=/healthz hcinterval=1 hcfails=2 hcpasses=2 hcexpr=ok
    BalancerMember "http://app2:8080" hcmethod=GET hcuri=/healthz hcinterval=1 hcfails=2 hcpasses=2 hcexpr=ok
    BalancerMember "http://app3:8080" hcmethod=GET hcuri=/healthz hcinterval=1 hcfails=2 hcpasses=2 hcexpr=ok
    ProxySet lbmethod=byrequests
</Proxy>
<Proxy "balancer://canary">
    BalancerMember "http://app1:8080" loadfactor=30
    BalancerMember "http://app2:8080" loadfactor=30
    BalancerMember "http://app3:8080" loadfactor=30
    BalancerMember "http://canary:8080" loadfactor=10
    ProxySet lbmethod=byrequests
</Proxy>

# ---------------------------------------------------------------------------------------------- cache / compression / limits
CacheRoot /var/cache/apache
CacheDirLevels 2
CacheDirLength 1
CacheEnable disk "/cacheable/"
CacheEnable disk "/cacheable-short/"
# X-Cache: HIT / MISS
CacheHeader On
CacheDetailHeader On
CacheStaleOnError On
CacheLock On
CacheLockPath /tmp/mod_cache-lock
CacheIgnoreHeaders Set-Cookie
# run the cache after mod_headers etc. (needed for the X-Lab-Proxy header on hits)
CacheQuickHandler Off

AddOutputFilterByType DEFLATE text/plain text/html text/css application/json application/javascript
AddOutputFilterByType BROTLI_COMPRESS text/plain text/html text/css application/json application/javascript
DeflateCompressionLevel 5
BrotliCompressionQuality 4

Header always unset X-Powered-By
Header unset X-Powered-By
RequestHeader set X-Lab-Proxy apache
RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"
RequestHeader set X-Forwarded-Proto "%{REQUEST_SCHEME}s"
RequestHeader set Forwarded "for=%{REMOTE_ADDR}s;proto=%{REQUEST_SCHEME}s;host=%{HTTP_HOST}s"
RequestHeader setifempty X-Request-ID "%{UNIQUE_ID}e"

# ---------------------------------------------------------------------------------------------- ACME (mod_md -> Pebble)
MDCertificateAuthority https://pebble:14000/dir
MDCertificateAgreement accepted
MDContactEmail admin@pxlab.test
MDCAChallenges http-01
MDPortMap http:80 https:8443
MDStoreDir /md
MDRenewWindow 33%
MDMessageCmd /usr/local/apache2/lab/md-message.sh
MDomain acme.lab

# ---------------------------------------------------------------------------------------------- TLS defaults
SSLProtocol -all +TLSv1.2 +TLSv1.3
SSLCipherSuite ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
SSLHonorCipherOrder off
SSLSessionCache shmcb:/tmp/ssl_scache(512000)
SSLSessionCacheTimeout 300
SSLUseStapling off

# ============================================================================================ default vhost (app.lab & anything else)
<Macro AppRoutes>
    RewriteEngine On
    # method / header / query routing
    RewriteCond %{REQUEST_METHOD} =DELETE
    RewriteRule ^/api/ - [R=405,L]
    RewriteCond %{HTTP:X-Canary} =1
    RewriteRule ^/(.*)$ http://canary:8080/$1 [P,L]
    RewriteCond %{QUERY_STRING} (^|&)beta=1(&|$)
    RewriteRule ^/(.*)$ http://canary:8080/$1 [P,L]
    # rewrite / redirect / fault
    RewriteRule ^/old/(.*)$ /new/$1 [PT,E=ROUTE:rewritten]
    RequestHeader set X-Route "%{ROUTE}e" env=ROUTE
    Redirect permanent /redirect-me /landing
    RewriteCond ${lottery:x} =1
    RewriteRule ^/fault$ - [R=503,L]
    RewriteCond %{REQUEST_METHOD} =OPTIONS
    RewriteRule ^/cors$ - [R=204,L]

    ProxyPass /static/ !
    ProxyPass /error.html !
    ProxyPass /redirect-me !
    ProxyPass /server-status !
    # mod_rewrite maps are per virtual host (not inherited): the 20 % lottery lives inside the macro
    RewriteMap lottery "rnd:/usr/local/apache2/lab/lottery.txt"
    Alias /static/ /static/
    Alias /error.html /static/error.html

    <Location /api/>
        RequestHeader set X-Route api
    </Location>
    # trailing slash = prefix stripped
    ProxyPass /api/ balancer://app/
    <LocationMatch "^/v[0-9]+/">
        RequestHeader set X-Route versioned
    </LocationMatch>
    ProxyPass /grpc.health.v1.Health/ h2c://app1:9090/grpc.health.v1.Health/
    ProxyPass /ws ws://app1:8080/ws
    <Location /sse>
        ProxyPass balancer://app/sse
    </Location>
    <Location /allowed>
        Require ip 10.77.0.1
    </Location>
    <Location /denied>
        <RequireAll>
            Require all granted
            Require not ip 10.77.0.0/24
        </RequireAll>
    </Location>
    <Location /basic>
        AuthType Basic
        AuthName "pxlab"
        AuthBasicProvider file
        AuthUserFile /auth/htpasswd
        Require valid-user
    </Location>
    <Location /upload>
        LimitRequestBody 1048576
    </Location>
    # LimitRequestBody is only enforced when the body is read by httpd; for a streamed proxy request check the length up front
    RewriteCond %{HTTP:Content-Length} >1048576
    RewriteRule ^/upload$ - [R=413,L]
    # mod_proxy shares one worker per backend URL: a per-route timeout needs its own worker URL (here the IP form of app1)
    ProxyPass /timeout http://10.77.0.11:8080/delay/5000 timeout=2 retry=0
    ProxyPass /conn-limited balancer://app/delay/1000
    <Location /bw>
        SetOutputFilter RATE_LIMIT
        SetEnv rate-limit 500
    </Location>
    ProxyPass /bw balancer://app/bin/1048576
    <Location /error-page>
        ProxyErrorOverride On
        ErrorDocument 503 /error.html
    </Location>
    <Location /error.html>
        Header always set X-Error-Page custom
    </Location>
    ProxyPass /error-page balancer://app/status/503
    <Location /cors>
        Header always set Access-Control-Allow-Origin "*"
        Header always set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
        Header always set Access-Control-Allow-Headers "Authorization, Content-Type"
        Header always set Access-Control-Max-Age "600"
    </Location>
    <Location /secure>
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
        Header always set X-Content-Type-Options nosniff
        Header always set X-Frame-Options DENY
        Header always set Referrer-Policy strict-origin-when-cross-origin
    </Location>
    ProxyPass /compressible balancer://app/size/65536
    ProxyPass / balancer://app/
    ProxyPassReverse / balancer://app/
</Macro>

<VirtualHost *:80 *:8080>
    ServerName app.lab
    ServerAlias localhost proxy
    Use AppRoutes
</VirtualHost>
<VirtualHost *:8443>
    ServerName app.lab
    ServerAlias localhost proxy
    SSLEngine on
    SSLCertificateFile /certs/app.lab.fullchain.crt
    SSLCertificateKeyFile /certs/app.lab.key
    Use AppRoutes
</VirtualHost>
# accepts PROXY protocol from clients (mod_remoteip)
<VirtualHost *:8082>
    ServerName app.lab
    ServerAlias localhost proxy
    RemoteIPProxyProtocol On
    Use AppRoutes
</VirtualHost>

# ============================================================================================ host routing
<VirtualHost *:80 *:8080 *:8443>
    ServerName a.lab
    SSLEngine on
    SSLCertificateFile /certs/app.lab.fullchain.crt
    SSLCertificateKeyFile /certs/app.lab.key
    RequestHeader set X-Route a
    ProxyPass / balancer://app/
</VirtualHost>
<VirtualHost *:80 *:8080 *:8443>
    ServerName b.lab
    SSLEngine on
    # its own certificate, selected by SNI
    SSLCertificateFile /certs/b.lab.fullchain.crt
    SSLCertificateKeyFile /certs/b.lab.key
    RequestHeader set X-Route b
    ProxyPass / http://b1:8080/
</VirtualHost>
<VirtualHost *:80 *:8080>
    ServerName redirect.lab
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

# ============================================================================================ load balancing
<VirtualHost *:8080>
    ServerName weighted.lab
    ProxyPass / balancer://weighted/
</VirtualHost>
<VirtualHost *:8080>
    ServerName leastconn.lab
    ProxyPass / balancer://leastconn/
</VirtualHost>
<VirtualHost *:8080>
    # no consistent hashing in mod_proxy_balancer: plain pool (declared unsupported)
    ServerName hash.lab
    ProxyPass / balancer://app/
</VirtualHost>
<VirtualHost *:8080>
    ServerName sticky.lab
    Header add Set-Cookie "lab_sticky=.%{BALANCER_WORKER_ROUTE}e; path=/; HttpOnly" env=BALANCER_ROUTE_CHANGED
    ProxyPass / balancer://sticky/ stickysession=lab_sticky
</VirtualHost>
<VirtualHost *:8080>
    ServerName retry.lab
    ProxyPass / balancer://retry/
</VirtualHost>
<VirtualHost *:8080>
    ServerName cb.lab
    ProxyPass / balancer://cb/
</VirtualHost>
<VirtualHost *:8080>
    ServerName health.lab
    ProxyPass / balancer://health/
</VirtualHost>
<VirtualHost *:8080>
    ServerName canary.lab
    ProxyPass / balancer://canary/
</VirtualHost>
<VirtualHost *:8080>
    # no mirroring in mod_proxy (declared unsupported)
    ServerName mirror.lab
    ProxyPass / balancer://app/
</VirtualHost>

# ============================================================================================ upstream protocols
<VirtualHost *:8080>
    # HTTP/2 (h2c) towards the upstream via mod_proxy_http2
    ServerName h2.lab
    ProxyPass / h2c://app1:8080/
</VirtualHost>
<VirtualHost *:8080>
    # TLS re-encryption, verified against the lab CA (SNI/peer name = app1; ProxyPreserveHost would send tls.lab as SNI)
    ServerName tls.lab
    ProxyPreserveHost Off
    SSLProxyVerify require
    SSLProxyVerifyDepth 2
    SSLProxyCACertificateFile /certs/ca.crt
    SSLProxyCheckPeerName on
    ProxyPass / https://app1:8443/
</VirtualHost>
<VirtualHost *:8080>
    # no PROXY protocol towards upstreams in mod_proxy (declared unsupported)
    ServerName pp.lab
    ProxyPass / balancer://app/
</VirtualHost>
<VirtualHost *:8080>
    # no external-auth subrequest in httpd core (declared unsupported)
    ServerName auth.lab
    ProxyPass / balancer://app/
</VirtualHost>
<VirtualHost *:8080>
    # JWT needs a third-party module (mod_auth_openidc / mod_authnz_jwt)
    ServerName jwt.lab
    ProxyPass / balancer://app/
</VirtualHost>

# ============================================================================================ TLS variants
# mTLS: client certificate required, CN forwarded
<VirtualHost *:8444>
    ServerName mtls.lab
    SSLEngine on
    SSLCertificateFile /certs/app.lab.fullchain.crt
    SSLCertificateKeyFile /certs/app.lab.key
    SSLCACertificateFile /certs/ca.crt
    SSLVerifyClient require
    SSLVerifyDepth 2
    SSLOptions +StdEnvVars
    RequestHeader set X-Client-Cert-CN "%{SSL_CLIENT_S_DN_CN}s"
    RequestHeader set X-Client-Cert-Verify "%{SSL_CLIENT_VERIFY}s"
    ProxyPass / balancer://app/
</VirtualHost>
# ACME certificate managed by mod_md (obtained from Pebble, activated by a graceful reload)
<VirtualHost *:8443>
    ServerName acme.lab
    SSLEngine on
    ProxyPass / balancer://app/
</VirtualHost>

# ============================================================================================ operations
<VirtualHost *:9101>
    ServerName status.lab
    <Location /server-status>
        SetHandler server-status
        Require all granted
    </Location>
    <Location /balancer-manager>
        SetHandler balancer-manager
        Require all granted
    </Location>
    <Location /md-status>
        SetHandler md-status
        Require all granted
    </Location>
</VirtualHost>
