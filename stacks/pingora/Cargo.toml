[package]
name = "pingora-lab"
version = "0.1.0"
edition = "2021"
description = "pxlab: a reverse proxy built on Cloudflare's Pingora framework that implements the lab contract in Rust"
license = "Apache-2.0"

[dependencies]
pingora = { version = "0.9", features = ["lb", "proxy", "openssl", "cache"] }
pingora-limits = "0.9"
async-trait = "0.1"
bytes = "1"
http = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
base64 = "0.22"
rand = "0.9"
uuid = { version = "1", features = ["v4"] }
regex = "1"
prometheus = { version = "0.14", features = ["process"] }   # process collector: metrics exist before the first request
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
once_cell = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
