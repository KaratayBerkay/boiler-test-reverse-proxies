# pingora-lab (custom Rust proxy on Cloudflare's Pingora framework; built by the Dockerfile).
name: pxlab-pingora
services:
  proxy:
    build: .
    image: pxlab-pingora:latest
    container_name: pxlab-pingora
    cpuset: "0-3"
    environment:
      RUST_LOG: warn
    volumes:
      - ./config.yaml:/etc/pingora/config.yaml:ro
      - ../../shared/certs:/certs:ro
      - ../../shared/static:/static:ro
    ports:
      - "18080:8080"
      - "18443:8443"
      - "18444:8444"
      - "19000:9000"
      - "19100:9100"
      - "19101:9101"
    ulimits:
      nofile: { soft: 1048576, hard: 1048576 }
    networks:
      pxlab:
        aliases: [proxy, app.lab, a.lab, b.lab, acme.lab, redirect.lab]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9100/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30
networks:
  pxlab:
    external: true
    name: pxlab
