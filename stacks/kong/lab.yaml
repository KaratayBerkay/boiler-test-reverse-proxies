display: Kong Gateway 3.9
image: kong:3.9
family: api-gateway
category: "API gateway on OpenResty (Lua plugins): routes/services/upstreams/consumers/plugins, DB-less declarative config"
container: pxlab-kong
version_cmd: [kong, version]
pre_up: ["python3 gen.py"]
reload_cmd: ["shell", "python3 gen.py >/dev/null && curl -fsS -o /dev/null -X POST http://127.0.0.1:19101/config -F config=@kong.yml"]
reload_kind: "api (POST /config on the admin API re-applies the declarative file atomically; `kong reload` only HUPs nginx and does NOT re-read it)"
admin: { kind: http, path: /status, expect: "server" }
metrics_path: /metrics
tracing_service: kong
cache_header: X-Cache-Status
features: { health_settle_s: 6, purge: { method: admin, verb: DELETE, path: /proxy-cache } }
unsupported:
  lb_mirror: "no traffic mirroring in Kong OSS"
  h2_upstream: "HTTP/2 to upstreams only for gRPC services (protocol grpc/grpcs)"
  proxy_protocol_upstream: "Kong cannot send PROXY protocol to upstreams"
  mtls_client_cert: "mtls-auth is a Kong Enterprise plugin; nginx-level ssl_verify_client would apply to every TLS listener"
  http3: "no HTTP/3 in Kong Gateway 3.9 OSS"
  cache_stale_on_error: "proxy-cache has no stale-if-error mode"
  compress_brotli: "gzip only (nginx gzip injected through KONG_NGINX_PROXY_GZIP)"
  compress_zstd: "gzip only"
  connection_limit: "no per-client concurrency limit in OSS (rate-limiting is per request)"
  forward_auth: "no forward-auth plugin in Kong OSS (openid-connect is Enterprise; write a pre-function with lua-resty-http)"
  bandwidth_limit: "no bandwidth limiting (response-ratelimiting counts requests)"
  docker_label_discovery: "no Docker provider (Kong Ingress Controller does this on Kubernetes)"
notes: >-
  Kong Gateway OSS 3.9 in DB-less mode with the expressions router. Upstreams demonstrate round-robin / weighted /
  least-connections / consistent-hashing (header, cookie stickiness), active + passive health checks and retries; bundled plugins
  cover rate limiting, IP restriction, basic auth, JWT, CORS, request/response transformers, proxy-cache (+ admin purge), request size
  limiting, correlation-id, prometheus, opentelemetry and acme (Pebble); pre/post-function serverless plugins do redirects, 405,
  fault injection, static files and the custom error page. Stream routes give TCP, UDP and TLS passthrough.
docs:
  - https://hub.docker.com/_/kong
  - https://docs.konghq.com/gateway/latest/production/deployment-topologies/db-less-and-declarative-config/
  - https://docs.konghq.com/gateway/latest/key-concepts/routes/expressions/
  - https://docs.konghq.com/hub/
  - https://docs.konghq.com/gateway/latest/reference/configuration/
