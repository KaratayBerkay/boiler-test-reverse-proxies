# hitch: TLS terminator in front of Varnish (Varnish Cache has no TLS). Speaks PROXY protocol v2 to Varnish so the
# client address and the TLS facts (proxy.is_ssl(), ALPN) survive the hop; h2 is negotiated by ALPN and handled by Varnish.
frontend = {
    host = "*"
    port = "8443"
}
frontend = {                              # mTLS listener: client certificate required (verified against the lab CA)
    host = "*"
    port = "8444"
    pem-file = "/certs/app.lab.pem"       # a frontend-level client-verify only applies to pem-files declared in that frontend
    client-verify = required
    client-verify-ca = "/certs/ca.crt"
}
backend = "[varnish]:6086"
write-proxy-v2 = on
alpn-protos = "h2, http/1.1"
pem-file = "/certs/app.lab.pem"           # first pem = default certificate; SNI selects the others
pem-file = "/certs/b.lab.pem"
tls-protos = TLSv1.2 TLSv1.3
ciphers = "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256"
prefer-server-ciphers = off
workers = 4
backlog = 4096
keepalive = 3600
user = "hitch"
group = "hitch"
daemon = off
quiet = on
