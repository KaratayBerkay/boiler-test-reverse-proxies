display: Varnish 8 + hitch
image: varnish:8.0
build: true
family: cache
category: "HTTP accelerator / caching reverse proxy (C, VCL-programmable) with hitch for TLS"
container: pxlab-varnish
containers: [pxlab-varnish, pxlab-hitch, pxlab-varnish-log, pxlab-varnish-exporter]
version_cmd: [varnishd, -V]
reload_cmd: [varnishreload, -n, /var/lib/varnish/pxlab]
reload_kind: "cli (varnishreload: vcl.load + vcl.use over the management interface; the new VCL takes over instantly, old VCL retires)"
admin: { kind: exec, cmd: [varnishadm, -n, /var/lib/varnish/pxlab, status], expect: "running" }
metrics_path: /metrics
tracing_service: ""
cache_header: X-Cache
access_log: { kind: docker, container: pxlab-varnish-log }
features: { health_settle_s: 5, log_flush_s: 2, tls_host: hitch }   # TLS scenarios target the hitch container
unsupported:
  lb_least_conn: "vmod_directors has round_robin / random / fallback / hash / shard - no least-connections director"
  lb_mirror: "no request mirroring"
  h2_upstream: "Varnish speaks HTTP/1.1 to backends; h2 is only available via vmod_reqwest over TLS (used for tls.lab)"
  tcp_l4: "Varnish is HTTP-only"
  udp_l4: "Varnish is HTTP-only"
  tls_passthrough_sni: "no L4 passthrough (hitch terminates TLS)"
  http3: "no HTTP/3 in Varnish Cache or hitch (Varnish Enterprise / a QUIC terminator in front)"
  grpc: "no gRPC: Varnish cannot proxy HTTP/2 with trailers to backends"
  acme_auto_cert: "hitch has no ACME client (use certbot/lego and reload hitch)"
  connection_limit: "no per-client concurrency limit (vsthrottle is a request-rate limiter)"
  bandwidth_limit: "no bandwidth limiting in Varnish Cache (Enterprise has vmod_tcp/..)"
  compress_brotli: "Varnish compresses with gzip only"
  compress_zstd: "gzip only"
  tracing_otel: "no OpenTelemetry in Varnish Cache"
  docker_label_discovery: "no Docker provider"
notes: >-
  Official varnish:8.0 image (ships vmod_vsthrottle, digest, reqwest, saintmode, fileserver, uuid, cookie ...) behind hitch for TLS
  (PROXY v2 between them, h2 via ALPN, mTLS on :8444). VCL implements routing, shard hashing, cookie stickiness, saintmode outlier
  ejection, retries, grace (stale-on-error), PURGE, vsthrottle rate limiting, JWT verification with vmod_digest, forward auth and a
  TLS/h2 backend with vmod_reqwest, static files with vmod_fileserver and custom error pages. varnishncsa and a Prometheus exporter run
  as sidecars on the shared VSM directory; varnishreload swaps VCL without dropping connections. No HTTP/3, gRPC, L4, ACME or brotli.
docs:
  - https://hub.docker.com/_/varnish
  - https://varnish-cache.org/docs/8.0/users-guide/vcl.html
  - https://varnish-cache.org/docs/8.0/reference/vmod_directors.html
  - https://github.com/varnish/hitch/blob/master/docs/configuration.md
  - https://github.com/varnish/varnish-modules
