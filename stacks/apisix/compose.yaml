# Apache APISIX 3.15 (official image), standalone mode: config.yaml (static) + apisix.yaml (routes, generated from apisix.src.yaml).
name: pxlab-apisix
services:
  proxy:
    image: apache/apisix:3.15.0-debian
    container_name: pxlab-apisix
    cpuset: "0-3"
    environment:
      APISIX_STAND_ALONE: "true"
    volumes:
      - ./config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
      - ../../shared/certs:/certs:ro
      - ../../shared/static:/static:ro
    ports:
      - "18080:8080"
      - "18443:8443"
      - "18443:8443/udp"
      - "18444:8444"
      - "18082:8082"
      - "19000:9000"
      - "19001:9001/udp"
      - "19100:9100"
      - "19101:9101"
    ulimits:
      nofile: { soft: 1048576, hard: 1048576 }
    networks:
      pxlab:
        aliases: [proxy, app.lab, a.lab, b.lab, acme.lab, redirect.lab]
    healthcheck:
      # no curl/wget in the image: bash /dev/tcp against the control API
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9101; printf 'GET /v1/healthcheck HTTP/1.0\\r\\n\\r\\n' >&3; timeout 2 cat <&3 | grep -q '200 OK'"]
      interval: 2s
      timeout: 3s
      retries: 30
networks:
  pxlab:
    external: true
    name: pxlab
