# Included in EVERY proxied location: nginx does not merge proxy_set_header across levels - one proxy_set_header in a
# location discards all inherited ones - so the common set lives here and is included explicitly.
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header Forwarded "for=$remote_addr;proto=$scheme;host=$host";
proxy_set_header X-Request-ID $req_id;
proxy_set_header X-Lab-Proxy nginx;
proxy_set_header Connection "";
proxy_hide_header X-Powered-By;
