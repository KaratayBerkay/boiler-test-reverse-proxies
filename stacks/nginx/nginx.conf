# pxlab reference configuration for NGINX (open source 1.29, official `nginx:1.29-otel` image).
# Implements the lab contract (docs/contract.md): every hostname / path below maps to one capability probe.
# Annotated walkthrough: docs/configs/nginx.md.

load_module modules/ngx_http_js_module.so;      # njs: JWT verification (auth_jwt is NGINX Plus only)
load_module modules/ngx_otel_module.so;         # OpenTelemetry tracing -> Jaeger
load_module modules/ngx_http_acme_module.so;    # native ACME client (1.29 preview) -> Pebble

worker_processes auto;                          # = CPUs visible in the cpuset (4)
worker_rlimit_nofile 200000;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 32768;
    multi_accept on;
}

# ------------------------------------------------------------------------------------------------ L4 (stream)
stream {
    log_format l4 '$remote_addr [$time_local] $protocol $status $bytes_sent $bytes_received $session_time "$upstream_addr" $ssl_preread_server_name';
    access_log /dev/stdout l4;

    # TCP proxy: :9000 -> app1:8080 (bytes pass untouched; the backend sees the proxy as the client)
    server {
        listen 9000;
        proxy_pass 10.77.0.11:8080;
        proxy_connect_timeout 3s;
    }
    # UDP proxy: :9001/udp -> app1:9002 (one datagram in, one datagram back)
    server {
        listen 9001 udp;
        proxy_pass 10.77.0.11:9002;
        proxy_responses 1;
        proxy_timeout 5s;
    }
    # TLS passthrough routed by SNI (no decryption): :8445 -> app1:8443
    map $ssl_preread_server_name $passthrough_target {
        passthrough.lab 10.77.0.11:8443;
        default         10.77.0.11:8443;
    }
    server {
        listen 8445;
        ssl_preread on;
        proxy_pass $passthrough_target;
    }
}

# ------------------------------------------------------------------------------------------------ L7 (http)
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;                          # "Server: nginx" without the version (removing it entirely needs headers-more)
    resolver 127.0.0.11 valid=10s ipv6=off;     # Docker's embedded DNS (needed by the ACME client and variable proxy_pass)

    # --- structured access log (JSON) to stdout -> `docker logs`
    log_format json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method","uri":"$request_uri",'
                                '"host":"$host","status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
                                '"upstream":"$upstream_addr","upstream_time":"$upstream_response_time","upstream_status":"$upstream_status",'
                                '"cache":"$upstream_cache_status","request_id":"$request_id","proto":"$server_protocol","ssl":"$ssl_protocol",'
                                '"ua":"$http_user_agent"}';
    access_log /dev/stdout json buffer=64k flush=1s;

    # --- tracing (OTLP/gRPC -> Jaeger)
    otel_exporter { endpoint jaeger:4317; }
    otel_service_name nginx;
    map $http_traceparent $trace_on { default 0; "~^00-[0-9a-f]{32}-[0-9a-f]{16}-01$" 1; }   # parent-based: trace only sampled parents (never the load paths)
    otel_trace $trace_on;
    otel_trace_context propagate;

    # --- performance basics
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_requests 10000;
    keepalive_timeout 75s;
    client_body_buffer_size 128k;
    proxy_buffers 16 16k;
    proxy_buffer_size 16k;
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_http_version 1.1;                     # required for upstream keep-alive and WebSocket
    proxy_next_upstream error timeout;          # retry the next server on connect failures / timeouts (idempotent requests)
    proxy_next_upstream_tries 3;

    # --- compression (gzip built in; brotli/zstd need third-party modules)
    gzip on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # --- response cache
    proxy_cache_path /var/cache/nginx/lab levels=1:2 keys_zone=lab:16m max_size=512m inactive=10m use_temp_path=off;
    proxy_cache_lock on;

    # --- rate / connection limits keyed by client IP
    limit_req_zone $binary_remote_addr zone=req_per_ip:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    # --- trust PROXY protocol / XFF only from inside the lab network
    set_real_ip_from 10.77.0.0/24;
    real_ip_header proxy_protocol;

    # --- maps: WebSocket upgrade, request id passthrough, header/query routing, sticky cookie, fault/canary splits
    map $http_upgrade $connection_upgrade { default upgrade; "" close; }
    map $http_x_request_id $req_id { default $http_x_request_id; "" $request_id; }
    map $http_x_canary $pool_by_header { default pool_app; "1" pool_canary; }
    map $arg_beta $pool_default { default $pool_by_header; "1" pool_canary; }
    map $cookie_lab_sticky $sticky_target { default ""; "~^(?<a>10\.77\.0\.1[1-3]:8080)$" $a; }
    split_clients "${request_id}" $fault_503 { 20% "1"; * ""; }
    split_clients "${request_id}canary" $pool_canary_split { 10% pool_canary; * pool_app; }

    # --- upstream pools (keepalive = upstream connection pool per worker)
    # max_fails=5/fail_timeout=5s: the default (1 failure -> out for 10 s) lets one slow request take a whole pool out
    upstream pool_app       { server app1:8080 max_fails=5 fail_timeout=5s; server app2:8080 max_fails=5 fail_timeout=5s;
                              server app3:8080 max_fails=5 fail_timeout=5s; keepalive 64; }
    upstream pool_b         { server b1:8080; keepalive 16; }
    upstream pool_canary    { server canary:8080; keepalive 16; }
    upstream pool_weighted  { server app1:8080 weight=3; server app2:8080 weight=1; keepalive 32; }
    upstream pool_leastconn { least_conn; server app1:8080; server app2:8080; server slow:8080; keepalive 32; }
    upstream pool_hash      { hash $http_x_user consistent; server app1:8080; server app2:8080; server app3:8080; keepalive 32; }
    upstream pool_retry     { server app1:8080; server app2:8080; server app3:8099; keepalive 32; }                   # :8099 = nothing listening
    upstream pool_cb        { server app1:8080 max_fails=3 fail_timeout=10s; server app2:8080 max_fails=3 fail_timeout=10s;
                              server flaky:8080 max_fails=3 fail_timeout=10s; keepalive 32; }
    upstream pool_grpc      { server app1:9090; keepalive 256; }
    upstream pool_tls       { server app1:8443; keepalive 16; }

    # ACME: certificates for acme.lab issued by Pebble (HTTP-01 on port 80)
    acme_issuer pebble {
        uri https://pebble:14000/dir;
        contact admin@pxlab.test;
        ssl_trusted_certificate /certs/pebble-ca.pem;
        state_path /var/cache/nginx/acme-pebble;
        accept_terms_of_service;
    }
    acme_shared_zone zone=ngx_acme_shared:1M;

    js_import lab from /etc/nginx/lab/njs/lab.js;

    # ============================================================================================ default vhost: app.lab
    server {
        listen 80 default_server;
        listen 8080 default_server;
        listen 8443 ssl default_server;
        listen 8443 quic reuseport;             # HTTP/3
        http2 on;                               # h2 on TLS, h2c (prior knowledge) on plain listeners
        server_name app.lab localhost proxy;
        ssl_certificate /certs/app.lab.fullchain.crt;
        ssl_certificate_key /certs/app.lab.key;
        include /etc/nginx/lab/snippets/tls.conf;
        add_header Alt-Svc 'h3=":8443"; ma=86400';

        location / {                            # header/query routing decide the pool; default pool_app round-robin
            include /etc/nginx/lab/snippets/proxy-headers.conf;
            proxy_pass http://$pool_default;
        }
        location /small { include /etc/nginx/lab/snippets/proxy-headers.conf; proxy_pass http://pool_app; access_log off; }
        location /bin/  { include /etc/nginx/lab/snippets/proxy-headers.conf; proxy_pass http://pool_app; access_log off; }
        location /delay/ { include /etc/nginx/lab/snippets/proxy-headers.conf; proxy_pass http://pool_app; access_log off; }

        # prefix route + strip prefix (trailing slash on proxy_pass replaces the matched prefix)
        location /api/ {
            if ($request_method = DELETE) { return 405; }
            include /etc/nginx/lab/snippets/proxy-headers.conf;
            proxy_set_header X-Route api;
            proxy_pass http://pool_app/;
        }
        # regex route
        location ~ ^/v[0-9]+/ {
            include /etc/nginx/lab/snippets/proxy-headers.conf;
            proxy_set_header X-Route versioned;
            proxy_pass http://pool_app;
        }
        # rewrite
        location /old/ {
            rewrite ^/old/(.*)$ /new/$1 break;
            include /etc/nginx/lab/snippets/proxy-headers.conf;
            proxy_set_header X-Route rewritten;
            proxy_pass http://pool_app;
        }
        location = /redirect-me { return 301 /landing; }

        # WebSocket
        location = /ws {
            include /etc/nginx/lab/snippets/proxy-headers-ws.conf;
            proxy_read_timeout 300s;
            proxy_pass http://pool_app;
        }
        # SSE / streaming: no response buffering
        location = /sse {
            include /etc/nginx/lab/snippets/proxy-headers.conf;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_pass http://pool_app;
        }
        # gRPC (h2 from the client, h2c to the backend)
        location /grpc.health.v1.Health/ {
            grpc_pass grpc://pool_grpc;
            grpc_set_header X-Lab-Proxy nginx;
        }

        # limits
        location = /limited {
            limit_req zone=req_per_ip burst=5 nodelay;
            limit_req_status 429;
            include /etc/nginx/lab/snippets/proxy-headers.conf;
            proxy_pass http://pool_app;
        }
        location = /conn-limited {
            limit_conn conn_per_ip 3;
            limit_conn_status 429;
            include /etc/nginx/lab/snippets/proxy-headers.conf;
            proxy_pass http://pool_app/delay/1000;
        }
        location = /allowed { allow 10.77.0.1; deny all; include /etc/nginx/lab/snippets/proxy-headers.conf; proxy_pass http://pool_app; }
        location = /denied  { deny 10.77.0.0/24; allow all; include /etc/nginx/lab/snippets/proxy-headers.conf; proxy_pass http://pool_app; }
        location = /basic {
            auth_basic "pxlab";
            auth_basic_user_file /auth/htpasswd;
            include /etc/nginx/lab/snippets/proxy-headers.conf;
            proxy_pass http://pool_app;
        }
        location = /upload {
            client_max_body_size 1m;
            include /etc/nginx/lab/snippets/proxy-headers.conf;
            proxy_pass http://pool_app;
        }
        location = /timeout {
            proxy_read_timeout 2s;
            proxy_next_upstream off;            # otherwise a timeout is retried on every server (3 x 2 s) and marks them all failed
            include /etc/nginx/lab/snippets/proxy-headers.conf;
            proxy_pass http://pool_app/delay/5000;
        }
        location = /fault {
            if ($fault_503) { return 503; }
            include /etc/nginx/lab/snippets/proxy-headers.conf;
            proxy_pass http://pool_app;
        }
        location = /bw {
            limit_rate 500k;
            include /etc/nginx/lab/snippets/proxy-headers.conf;
            proxy_pass http://pool_app/bin/1048576;
        }
        location /static/ { alias /static/; }
        location = /error-page {
            proxy_intercept_errors on;
            error_page 500 502 503 504 /_error.html;
            include /etc/nginx/lab/snippets/proxy-headers.conf;
            proxy_pass http://pool_app/status/503;
        }
        location = /_error.html { internal; root /static; try_files /error.html =503; add_header X-Error-Page custom always; }
        location = /cors {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "$http_origin" always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
                add_header Access-Control-Max-Age 600 always;
                return 204;
            }
            add_header Access-Control-Allow-Origin "$http_origin" always;
            include /etc/nginx/lab/snippets/proxy-headers.conf;
            proxy_pass http://pool_app;
        }
        location = /secure {
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            include /etc/nginx/lab/snippets/proxy-headers.conf;
            proxy_pass http://pool_app;
        }
        # cache: honours the origin's Cache-Control (max-age / stale-while-revalidate / stale-if-error);
        # PURGE = refresh (real invalidation is NGINX Plus `proxy_cache_purge` or the ngx_cache_purge module)
        location /cacheable/ {
            proxy_cache lab;
            proxy_cache_key $scheme$host$uri;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_bypass $http_x_refresh;         # X-Refresh: 1 forces a fetch whose response replaces the entry
            if ($request_method = PURGE) { return 418; }
            error_page 418 = @purge;
            add_header X-Cache $upstream_cache_status always;
            include /etc/nginx/lab/snippets/proxy-headers.conf;
            proxy_pass http://pool_app;
        }
        location @purge {                       # PURGE = loop back into nginx as a GET with X-Refresh: 1 -> bypass + store (real purge is Plus / ngx_cache_purge)
            proxy_method GET;
            proxy_set_header Host $host;
            proxy_set_header X-Refresh 1;
            proxy_pass http://127.0.0.1:8080$uri;
        }
        location /cacheable-short/ {
            proxy_cache lab;
            proxy_cache_key $scheme$host$uri;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header X-Cache $upstream_cache_status always;
            include /etc/nginx/lab/snippets/proxy-headers.conf;
            proxy_pass http://pool_app;
        }
        location = /compressible {
            include /etc/nginx/lab/snippets/proxy-headers.conf;
            proxy_pass http://pool_app/size/65536;
        }
    }

    # ============================================================================================ host routing
    server {
        listen 80; listen 8080; listen 8443 ssl; http2 on;
        server_name a.lab;
        ssl_certificate /certs/app.lab.fullchain.crt; ssl_certificate_key /certs/app.lab.key;
        location / { include /etc/nginx/lab/snippets/proxy-headers.conf; proxy_set_header X-Route a; proxy_pass http://pool_app; }
    }
    server {
        listen 80; listen 8080; listen 8443 ssl; http2 on;
        server_name b.lab;
        ssl_certificate /certs/b.lab.fullchain.crt; ssl_certificate_key /certs/b.lab.key;   # a different certificate, selected by SNI
        location / { include /etc/nginx/lab/snippets/proxy-headers.conf; proxy_set_header X-Route b; proxy_pass http://pool_b; }
    }
    server { listen 80; listen 8080; server_name redirect.lab; return 301 https://$host$request_uri; }

    # ============================================================================================ load balancing
    server { listen 80; listen 8080; server_name weighted.lab;  location / { include /etc/nginx/lab/snippets/proxy-headers.conf; proxy_pass http://pool_weighted; } }
    server { listen 80; listen 8080; server_name leastconn.lab; location / { include /etc/nginx/lab/snippets/proxy-headers.conf; proxy_pass http://pool_leastconn; } }
    server { listen 80; listen 8080; server_name hash.lab;      location / { include /etc/nginx/lab/snippets/proxy-headers.conf; proxy_pass http://pool_hash; } }
    server { listen 80; listen 8080; server_name retry.lab;     location / { include /etc/nginx/lab/snippets/proxy-headers.conf; proxy_pass http://pool_retry; } }
    server {
        listen 80; listen 8080; server_name cb.lab;             # passive health: 3 failures (incl. HTTP 500) -> server out for 10 s
        location / {
            include /etc/nginx/lab/snippets/proxy-headers.conf;
            proxy_next_upstream error timeout http_500 http_502 http_503;
            proxy_pass http://pool_cb;
        }
    }
    server {                                                    # active health checks: NGINX Plus only -> plain pool (documented gap)
        listen 80; listen 8080; server_name health.lab;
        location / { include /etc/nginx/lab/snippets/proxy-headers.conf; proxy_pass http://pool_app; }
    }
    server {                                                    # sticky sessions in OSS: cookie = upstream address, map -> proxy_pass variable
        listen 80; listen 8080; server_name sticky.lab;
        location / {
            include /etc/nginx/lab/snippets/proxy-headers.conf;
            set $target http://pool_app;
            if ($sticky_target != "") { set $target http://$sticky_target; }
            add_header Set-Cookie "lab_sticky=$upstream_addr; Path=/; HttpOnly";
            proxy_pass $target;
        }
    }
    server { listen 80; listen 8080; server_name canary.lab;   location / { include /etc/nginx/lab/snippets/proxy-headers.conf; proxy_pass http://$pool_canary_split; } }
    server {
        listen 80; listen 8080; server_name mirror.lab;
        location / {
            mirror /_mirror;
            mirror_request_body on;
            include /etc/nginx/lab/snippets/proxy-headers.conf;
            proxy_pass http://pool_app;
        }
        location = /_mirror { internal; proxy_pass http://shadow:8080$request_uri; proxy_set_header X-Mirror-Of $request_id; }
    }

    # ============================================================================================ upstream protocols
    server {                                                    # TLS to the upstream, verified against the lab CA
        listen 80; listen 8080; server_name tls.lab;
        location / {
            include /etc/nginx/lab/snippets/proxy-headers.conf;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /certs/ca.crt;
            proxy_ssl_server_name on;
            proxy_ssl_name backend.lab;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_ssl_session_reuse on;
            proxy_pass https://pool_tls;
        }
    }
    server {                                                    # h2.lab / pp.lab: not possible with proxy_pass (HTTP/1.x only; PROXY protocol is stream-only)
        listen 80; listen 8080; server_name h2.lab pp.lab;
        location / { include /etc/nginx/lab/snippets/proxy-headers.conf; proxy_pass http://pool_app; }
    }

    # ============================================================================================ auth
    server {                                                    # forward auth: auth_request subrequest to the auth service
        listen 80; listen 8080; server_name auth.lab;
        location / {
            auth_request /_auth;
            auth_request_set $auth_user $upstream_http_x_auth_user;
            auth_request_set $auth_groups $upstream_http_x_auth_groups;
            include /etc/nginx/lab/snippets/proxy-headers.conf;
            proxy_set_header X-Auth-User $auth_user;
            proxy_set_header X-Auth-Groups $auth_groups;
            proxy_pass http://pool_app;
        }
        location = /_auth {
            internal;
            proxy_pass http://app1:8080/auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Method $request_method;
        }
    }
    server {                                                    # JWT (HS256) verified by njs (auth_jwt is NGINX Plus)
        listen 80; listen 8080; server_name jwt.lab;
        location / {
            auth_request /_jwt;
            auth_request_set $jwt_sub $sent_http_x_jwt_sub;
            include /etc/nginx/lab/snippets/proxy-headers.conf;
            proxy_set_header X-JWT-Sub $jwt_sub;
            proxy_pass http://pool_app;
        }
        location = /_jwt { internal; js_content lab.jwt; }
    }

    # ============================================================================================ TLS variants
    server {                                                    # mTLS: client certificate required, CN forwarded
        listen 8444 ssl; http2 on;
        server_name mtls.lab;
        ssl_certificate /certs/app.lab.fullchain.crt; ssl_certificate_key /certs/app.lab.key;
        ssl_client_certificate /certs/ca.crt;
        ssl_verify_client on;
        include /etc/nginx/lab/snippets/tls.conf;
        location / {
            include /etc/nginx/lab/snippets/proxy-headers.conf;
            proxy_set_header X-Client-Cert-CN $ssl_client_s_dn;
            proxy_set_header X-Client-Cert-Verify $ssl_client_verify;
            proxy_pass http://pool_app;
        }
    }
    server {                                                    # ACME: certificate issued by Pebble; HTTP-01 answered on :80 by the module
        listen 80;
        listen 8443 ssl; http2 on;
        server_name acme.lab;
        acme_certificate pebble;
        ssl_certificate $acme_certificate;
        ssl_certificate_key $acme_certificate_key;
        ssl_certificate_cache max=2;
        location / { include /etc/nginx/lab/snippets/proxy-headers.conf; proxy_pass http://pool_app; }
    }
    server {                                                    # accepts PROXY protocol from clients (e.g. behind an L4 balancer)
        listen 8082 proxy_protocol;
        server_name app.lab;
        location / { include /etc/nginx/lab/snippets/proxy-headers.conf; proxy_pass http://pool_app; }
    }

    # ============================================================================================ operations
    server {
        listen 9101;
        location = /nginx_status { stub_status; }               # scraped by the prometheus exporter sidecar (:9100)
        location = /healthz { return 200 "ok\n"; }
    }
}
