# header_rewrite (global plugin instance): request headers every origin sees, response cleanup.
# Global instances hook the transaction (READ_REQUEST_HDR_HOOK runs before remap); per-remap files use REMAP_PSEUDO_HOOK.
cond %{READ_REQUEST_HDR_HOOK}
set-header X-Lab-Proxy "ats"
set-header X-Real-IP %{IP:CLIENT}
set-header X-Forwarded-Proto %{CLIENT-URL:SCHEME}
set-header X-Forwarded-Host %{CLIENT-HEADER:Host}
set-header Forwarded "for=%{IP:CLIENT};proto=%{CLIENT-URL:SCHEME};host=%{CLIENT-HEADER:Host}"

cond %{READ_REQUEST_HDR_HOOK}
cond %{CLIENT-HEADER:X-Request-ID} ="" [OR]
cond %{CLIENT-HEADER:X-Request-ID} =""
set-header X-Request-ID %{ID:UNIQUE}

cond %{READ_RESPONSE_HDR_HOOK}
rm-header X-Powered-By

cond %{SEND_RESPONSE_HDR_HOOK}
set-header X-Cache %{CACHE}
