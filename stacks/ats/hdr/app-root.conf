# default route of app.lab: header / query routing to the canary origin and the "versioned" regex route marker
cond %{REMAP_PSEUDO_HOOK}
cond %{CLIENT-HEADER:X-Canary} ="1" [OR]
cond %{CLIENT-URL:QUERY} /(^|&)beta=1(&|$)/
set-destination HOST canary
set-destination PORT 8080

cond %{REMAP_PSEUDO_HOOK}
cond %{CLIENT-URL:PATH} /^v[0-9]+\//
set-header X-Route "versioned"
