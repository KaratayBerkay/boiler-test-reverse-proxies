# tiny static origin (nginx) used by proxies that cannot serve files themselves (error pages, 405 responses)
server {
    listen 80;
    root /static;
    server_tokens off;
    location = /error.html { add_header X-Error-Page custom always; }
    location = /405 { return 405; }
    location / { }
}

# ACME directory shim: some ACME clients (Kong's acme plugin) insist on a URL ending in /directory, Pebble only serves /dir.
# The other ACME endpoints are absolute URLs returned by the directory, so only this one hop needs the shim.
server {
    listen 14001 ssl;
    server_name static;
    ssl_certificate /certs/app.lab.fullchain.crt;
    ssl_certificate_key /certs/app.lab.key;
    location = /directory {
        proxy_pass https://pebble:14000/dir;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /certs/pebble-ca.pem;
        proxy_ssl_server_name on;
        proxy_ssl_name pebble;
        proxy_set_header Host pebble:14000;
    }
}
